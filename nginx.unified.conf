# ============================================================
# NEXUS GESTÃO — nginx.unified.conf
# Container unificado: Nginx serve o frontend e faz proxy
# para o backend Node.js que roda internamente na porta 3001
# ============================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;

    # ── Compressão Gzip ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/manifest+json image/svg+xml;

    # ── Proxy para a API do backend (Node.js interno) ────────
    # Backend roda na porta 3001 dentro do mesmo container
    location /api/ {
        proxy_pass         http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        # Retorna JSON de erro em vez de página HTML do nginx
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    location @backend_unavailable {
        default_type application/json;
        return 503 '{"error":"Serviço temporariamente indisponível. Aguarde alguns instantes."}';
    }

    # ── Health check real do backend ──────────────────────────
    # O HEALTHCHECK do Dockerfile bate em http://localhost/health (porta 80).
    # Sem este location, essa URL cairia no bloco SPA (location /) e o Nginx
    # responderia 200 com o index.html mesmo com o backend Node fora do ar —
    # mascarando o problema e impedindo o Coolify de detectar/reiniciar o
    # container quando a API cai.
    location = /health {
        proxy_pass         http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    5s;
        # Se o backend nem responder, devolve 503 explícito em vez de
        # deixar o Nginx tentar servir outra coisa.
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    # ── Proxy para uploads (servidos pelo backend) ───────────
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         Cache-Control "public, max-age=2592000";
    }

    # ── Service Worker — nunca cachear ───────────────────────
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location ~* workbox.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ── Manifest PWA ─────────────────────────────────────────
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }


    # ── Recuperação de chunks JS antigos ─────────────────────
    # Quando o navegador fica com index.html antigo em cache, ele pode pedir
    # /assets/index-*.js que não existe mais no deploy novo. Em vez de deixar
    # a aplicação em tela branca com 404, entregamos um JS pequeno que limpa
    # caches/service workers antigos e recarrega a rota atual uma única vez.
    location ~* ^/assets/.*\.js$ {
        try_files $uri @vite_js_missing;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location @vite_js_missing {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        # Trava por tempo (15s) E por número de tentativas (máx. 2). Sem o limite de
        # tentativas, um backend em crash-loop (container caindo e subindo sem parar)
        # fazia essa recuperação recarregar a página indefinidamente a cada 15s+ —
        # dando a impressão de "a página recarrega sozinha e não carrega mais",
        # já que o motivo real (container fora do ar) nunca é só "cache antigo".
        # Depois de 2 tentativas sem sucesso, para de recarregar e deixa o erro
        # de asset aparecer normalmente no console, em vez de loop silencioso.
        return 200 '(() => { const kTime="nexus_asset_recovery_at"; const kCount="nexus_asset_recovery_count"; const now=Date.now(); const MAX_ATTEMPTS=2; try { const last=Number(sessionStorage.getItem(kTime)||"0"); const count=Number(sessionStorage.getItem(kCount)||"0"); if (last && now-last<15000) { console.error("Nexus asset ausente após reload protegido."); return; } if (count >= MAX_ATTEMPTS) { console.error("Nexus: assets continuam ausentes após " + MAX_ATTEMPTS + " tentativas de recuperação. Backend/deploy pode estar indisponível — não vou recarregar de novo automaticamente."); return; } sessionStorage.setItem(kTime,String(now)); sessionStorage.setItem(kCount,String(count+1)); } catch(e) {} const jobs=[]; if ("serviceWorker" in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{})); if ("caches" in window) jobs.push(caches.keys().then(ks=>Promise.all(ks.map(c=>caches.delete(c)))).catch(()=>{})); Promise.all(jobs).finally(() => { const u=new URL(location.href); u.searchParams.set("_nexus_reload", String(now)); location.replace(u.toString()); }); })();';
    }

    # CSS antigo não deve bloquear a abertura do app.
    location ~* ^/assets/.*\.css$ {
        try_files $uri @vite_css_missing;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location @vite_css_missing {
        default_type text/css;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        return 200 '';
    }

    # ── Imagens e fontes ─────────────────────────────────────
    location ~* \.(png|svg|ico|woff2|woff|ttf|webp)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── SPA: todas as rotas → index.html ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Headers de segurança ─────────────────────────────────
    # Permite incorporar o Nexus existente dentro do Destrava, sem duplicar aplicativo.
    add_header Content-Security-Policy "frame-ancestors 'self' https://destravacredito.com https://destravacredito.com.br" always;
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
